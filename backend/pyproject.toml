[tool.poetry]
name = "jarvis-backend"
version = "0.1.0"
description = "Jarvis FastAPI backend: OpenAI chat, task classification, desktop agent"
authors = []
readme = "README.md"
packages = [{ include = "*", from = "." }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.109.0"
uvicorn = { extras = ["standard"], version = ">=0.27.0" }
python-dotenv = ">=1.0.0"
pyyaml = ">=6.0.1"
openai = ">=1.12.0"
httpx = ">=0.26.0"
ddgs = ">=9.0.0"
python-multipart = ">=0.0.9"
pyautogui = ">=0.9.54"
mss = ">=9.0.0"
pillow = ">=10.0.0"
websockets = ">=12.0"
langgraph = ">=0.2.0"
yfinance = ">=0.2.40"
matplotlib = ">=3.8.0"
numpy = ">=1.26.0"
pandas = ">=2.1.0"
langchain-openai = ">=0.2.0"
langchain-core = ">=0.3.0"
huggingface-hub = ">=0.26.0"
chess = ">=1.10.0"

[tool.poetry.group.dev.dependencies]
pyinstaller = ">=6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
